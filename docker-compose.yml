services:
  maps:
    image: ${GMS_IMAGE:-gosom/google-maps-scraper:latest}
    command: ["-web", "-addr", ":8080", "-data-folder", "/gmapsdata"]
    ports:
      - "${GMS_BIND_ADDRESS:-127.0.0.1}:${GMS_HOST_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${GMS_DATA_DIR:-./storage/gmapsdata}
        target: /gmapsdata
    init: true
    restart: unless-stopped
